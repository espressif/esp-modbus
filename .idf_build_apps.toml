# See https://docs.espressif.com/projects/idf-build-apps/en/latest/references/config_file.html

config_rules = [
    "sdkconfig.ci.*=",
    "!sdkconfig.ci.defaults",
    "=default",
]

sdkconfig_defaults = "sdkconfig.defaults;sdkconfig.ci.defaults"

recursive = true
check_warnings = true
keep_going = true

build_dir = "build_@t_@w"
build_log_filename = "build_log.txt"
size_json_filename = "size.json"

collect_app_info_filename = "app_info_@p.txt"

check_manifest_rules = true
manifest_filepatterns = ["**/.build-test-rules.yml"]
ignore_warning_files = ["tools/ignore_build_warnings.txt"]

# Rebuild everything when CI/config that controls selection changes.
deactivate_dependency_driven_build_by_filepatterns = [
    ".gitlab-ci.yml",
    ".gitlab/ci/**",
    ".idf_ci.toml",
    ".idf_build_apps.toml",
    ".build-test-rules.yml",
    "conftest.py",
]
