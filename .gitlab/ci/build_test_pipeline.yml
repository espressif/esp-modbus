# Component-based build/test pipeline for esp-modbus
include:
  - component: $CI_SERVER_FQDN/ci/actions/idf-dynamic-pipeline/ci-component@main
    inputs:
      build-job-tags: ["build"]
      job-suffix: ":idf-latest"
  - component: $CI_SERVER_FQDN/ci/actions/idf-dynamic-pipeline/ci-component@main
    inputs:
      build-job-tags: ["build"]
      job-suffix: ":idf-v6.1"
  - component: $CI_SERVER_FQDN/ci/actions/idf-dynamic-pipeline/ci-component@main
    inputs:
      build-job-tags: ["build"]
      job-suffix: ":idf-v6.0"
  - component: $CI_SERVER_FQDN/ci/actions/idf-dynamic-pipeline/ci-component@main
    inputs:
      build-job-tags: ["build"]
      job-suffix: ":idf-v5.5"
  - component: $CI_SERVER_FQDN/ci/actions/idf-dynamic-pipeline/ci-component@main
    inputs:
      build-job-tags: ["build"]
      job-suffix: ":idf-v5.4"
  - component: $CI_SERVER_FQDN/ci/actions/idf-dynamic-pipeline/ci-component@main
    inputs:
      build-job-tags: ["build"]
      job-suffix: ":idf-v5.3"

.rules_manual_on_main_push: &rules_manual_on_main_push
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_REF_NAME == "main" && $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: true
    - when: on_success

generate_build_child_pipeline:idf-latest:
  needs:
    - job: pipeline_variables:idf-latest
    - job: baseline_manifest_sha:idf-latest
      optional: true
    - job: changed-files

generate_build_child_pipeline:idf-v6.1:
  needs:
    - job: pipeline_variables:idf-v6.1
    - job: baseline_manifest_sha:idf-v6.1
      optional: true
    - job: changed-files

generate_build_child_pipeline:idf-v6.0:
  needs:
    - job: pipeline_variables:idf-v6.0
    - job: baseline_manifest_sha:idf-v6.0
      optional: true
    - job: changed-files

generate_build_child_pipeline:idf-v5.5:
  needs:
    - job: pipeline_variables:idf-v5.5
    - job: baseline_manifest_sha:idf-v5.5
      optional: true
    - job: changed-files

generate_build_child_pipeline:idf-v5.4:
  needs:
    - job: pipeline_variables:idf-v5.4
    - job: baseline_manifest_sha:idf-v5.4
      optional: true
    - job: changed-files

generate_build_child_pipeline:idf-v5.3:
  needs:
    - job: pipeline_variables:idf-v5.3
    - job: baseline_manifest_sha:idf-v5.3
      optional: true
    - job: changed-files

build_child_pipeline:idf-v6.1:
  <<: *rules_manual_on_main_push

build_child_pipeline:idf-v6.0:
  <<: *rules_manual_on_main_push

build_child_pipeline:idf-v5.5:
  <<: *rules_manual_on_main_push

build_child_pipeline:idf-v5.4:
  <<: *rules_manual_on_main_push

build_child_pipeline:idf-v5.3:
  <<: *rules_manual_on_main_push
